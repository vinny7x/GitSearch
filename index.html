<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/imgs/favicon/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="js/components/site-footer.js"></script>
    <title>GitSearch</title>
</head>

<body class="bg-sky-300">
    <header>
        <div class="min-h-screen flex flex-col items-center justify-center text-center px-6">

                <h1 class="text-6xl font-bold text-slate-900">
                    GitSearch
                </h1>

                <p class="mt-4 text-lg text-slate-800 font-medium">

                </p>

                <p class="mt-3 max-w-3xl text-slate-700">

                </p>

                <a href="#">
                    <button
                        class="mt-8 px-6 py-3 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition cursor-pointer">

                    </button>
                </a>

            </div>
        </div>
    </header>
    <site-footer />

</html>
